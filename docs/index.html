<title>DiligencIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra superior azul petróleo + menú lateral (escritorio) / pestañas desplazables (celular) + área de trabajo con tarjetas por rol */
:root{
  --petroleo:#1E3A4C; --ambar:#E0A21A; --wa:#1F8A4C;
  --bg:#EEF2F1; --surface:#FFFFFF; --fg:#15232B; --muted:#5B6B72; --line:#D6DFDD; --soft:#F5F8F7;

  --f-tit:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-txt:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A20; --surface:#17262F; --fg:#E4ECEE; --muted:#9AAAB0; --line:#2A3C46; --soft:#1C2E38;
  --rojo:#F07A6C; --rojo-bg:#3A1F1C; --amb-bg:#3A2F14; --ver-bg:#173326; --azul-bg:#1D3341; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A20; --surface:#17262F; --fg:#E4ECEE; --muted:#9AAAB0; --line:#2A3C46; --soft:#1C2E38;
  --rojo:#F07A6C; --rojo-bg:#3A1F1C; --amb-bg:#3A2F14; --ver-bg:#173326; --azul-bg:#1D3341; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-txt);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-tit);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:26px} h3{font-size:19px} h4{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--petroleo)}
:root:not([data-theme="light"]) a{color:inherit}
.num{font-variant-numeric:tabular-nums}
/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#1E3A4C;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:36px;height:36px;flex:none}

.top .ofi{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.ofi-logo{width:34px;height:34px;border-radius:8px;background:#fff;object-fit:contain;flex:none}
.ofi-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.ofi-user{font-size:11px;opacity:.8}
.top select{background:#2B4E63;border:1px solid #3D6378;color:#fff;border-radius:8px;padding:6px 8px;max-width:150px}
.top .salir{background:transparent;border:1px solid #5C7C8E;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
/* estructura */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 58px)}
nav.menu{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav.menu button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--fg);font-weight:500}
nav.menu button:hover{background:var(--soft)}
nav.menu button.on{background:#1E3A4C;color:#fff;box-shadow:inset 4px 0 0 #E0A21A}
nav.menu .cnt{margin-left:auto;background:var(--ambar);color:#15232B;border-radius:20px;font-size:11px;font-weight:700;padding:0 7px}
main{padding:20px 16px 60px;min-width:0;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:16px}
.head p{margin:2px 0 0;color:var(--muted)}
.head .acc{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.menu{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:15}
  nav.menu button{white-space:nowrap;padding:7px 11px}
  nav.menu button.on{box-shadow:inset 0 -3px 0 #E0A21A}

  .top .ofi-user,.brand .bt small{display:none}
}
@media (max-width:520px){ .top select{max-width:100px} .ofi-logo{display:none} }
/* componentes */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;color:var(--fg);text-decoration:none}
.btn:hover{border-color:var(--petroleo)}
.btn.pri{background:#1E3A4C;border-color:#1E3A4C;color:#fff}
.btn.pri:hover{background:#28506A}
.btn.amb{background:#E0A21A;border-color:#E0A21A;color:#15232B}
.btn.wa{background:#1F8A4C;border-color:#1F8A4C;color:#fff}
.btn.peq{padding:4px 9px;font-size:12px}
.btn.del{color:var(--rojo)}
.btn:focus-visible,nav.menu button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #E0A21A;outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .k{font-family:var(--f-tit);font-size:clamp(22px,4.6vw,34px);font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alerta{border-color:#E0A21A;box-shadow:inset 0 3px 0 #E0A21A}
.kpi.peligro{border-color:var(--rojo);box-shadow:inset 0 3px 0 var(--rojo)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.p-rojo{background:var(--rojo-bg);color:var(--rojo)}
.p-amb{background:var(--amb-bg);color:#9A6A00}
:root:not([data-theme="light"]) .p-amb{color:#9A6A00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .p-amb{color:#F0C25A}}
:root[data-theme="dark"] .p-amb{color:#F0C25A}
.p-ver{background:var(--ver-bg);color:#1F8A4C}
.p-azul{background:var(--azul-bg);color:var(--fg)}
.p-gris{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.muted{color:var(--muted)} .small{font-size:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.li .grow{flex:1;min-width:0}
.d-rojo{background:var(--rojo)} .d-amb{background:#E0A21A} .d-ver{background:#1F8A4C} .d-azul{background:#1E3A4C}
.fecha{font-family:var(--f-tit);font-weight:600;font-size:15px;text-align:center;min-width:48px;line-height:1.05;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--soft)}
.fecha b{display:block;font-size:22px}
form.f,.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.f .full{grid-column:1/-1}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-weight:400;font-size:14px;color:var(--fg);min-width:0}
.f textarea{min-height:70px;resize:vertical}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--fg)!important;font-weight:500!important}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-width:0}
.toolbar input[type=search]{flex:1;min-width:180px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:#E0A21A}
.empty{padding:26px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv dt{font-weight:600}}
.rad{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.02em}
.rad span{padding:0 1px;border-bottom:2px solid var(--line);margin-right:2px}
.note{background:var(--azul-bg);border-radius:8px;padding:10px 12px;font-size:13px}
.note.amb{background:var(--amb-bg)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,26,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.modal .box{background:var(--surface);border-radius:12px;width:100%;max-width:760px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .box.ancho{max-width:900px}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal .mh .x{margin-left:auto;background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.modal .mf{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1E3A4C;color:#fff;padding:10px 18px;border-radius:8px;z-index:60;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
/* documento imprimible: siempre en blanco */
.doc{background:#fff;color:#15232B;border:1px solid #D6DFDD;border-radius:6px;padding:34px 38px;font-family:var(--f-txt);font-size:13.5px;line-height:1.6}
.doc h1{font-size:24px;color:#1E3A4C;margin:0}
.doc .dh{display:flex;align-items:center;gap:14px;border-bottom:3px solid #1E3A4C;padding-bottom:12px;margin-bottom:18px}
.doc .dh img{width:58px;height:58px;object-fit:contain}
.doc .dh .meta{margin-left:auto;text-align:right;font-size:12px;color:#5B6B72}
.doc table{font-size:13px} .doc th{background:#EEF2F1;color:#1E3A4C} .doc td,.doc th{border-bottom:1px solid #D6DFDD}
.doc .tot{font-family:var(--f-tit);font-size:22px;color:#1E3A4C}
.doc .firma{margin-top:46px;display:flex;gap:40px;flex-wrap:wrap}
.doc .firma div{border-top:1px solid #15232B;padding-top:4px;min-width:220px;font-size:12px}
.doc .pie{margin-top:28px;border-top:1px solid #D6DFDD;padding-top:8px;font-size:10.5px;color:#5B6B72;display:flex;align-items:center;gap:8px}
.doc .pie svg{width:18px;height:18px}
.doc mark.ph{background:#FCF3DD;color:#15232B;border-radius:3px;padding:0 2px}
.doc .doc-body{outline:none}.doc .doc-body:focus{box-shadow:0 0 0 2px #E0A21A33;border-radius:4px}
.doc h4{font-size:14px;color:#1E3A4C;margin:14px 0 4px}
@media print{.doc mark.ph{background:none}}
@media (max-width:600px){.doc{padding:20px 16px}}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal .dn{background:var(--soft);font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cal .c{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;font-size:11px;min-width:0}
.cal .c:nth-child(7n){border-right:0}
.cal .c.fuera{background:var(--soft);opacity:.55}
.cal .c.inh{background:repeating-linear-gradient(135deg,var(--soft),var(--soft) 6px,var(--surface) 6px,var(--surface) 12px)}
.cal .c.hoy .n{background:#E0A21A;color:#15232B;border-radius:50%}
.cal .n{display:inline-block;width:22px;height:22px;text-align:center;line-height:22px;font-weight:700}
.cal .ev{display:block;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;width:100%;text-align:left;font-size:11px}
.cal .ev.aud{background:#1E3A4C;color:#fff} .cal .ev.ter{background:var(--rojo-bg);color:var(--rojo)} .cal .ev.otr{background:var(--amb-bg);color:var(--fg)}
.cal .fest{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){.cal .c{min-height:58px}.cal .ev{font-size:0;height:6px;padding:0}}
/* acceso */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:30px 16px;background:linear-gradient(160deg,#1E3A4C 0,#1E3A4C 46%,var(--bg) 46%)}
.login .box{background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.roles button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left;cursor:pointer}
.roles button:hover{border-color:#E0A21A;box-shadow:inset 0 0 0 1px #E0A21A}
.roles b{display:block;font-family:var(--f-tit);font-size:17px}
.roles span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:#1E3A4C}
.bar i.a{background:#E0A21A}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .25s ease}@keyframes up{from{transform:translate(-50%,10px);opacity:0}}}
</style>

<script src="config.js"></script><script>
// ===================== DiligencIA · núcleo =====================
const LOGO_SG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-hidden="true"><rect x="4" y="4" width="192" height="192" rx="46" fill="#1E3A4C"/><g stroke="#FFFFFF" stroke-linecap="round"><polygon points="100,42 150.2,71 150.2,129 100,158 49.8,129 49.8,71" fill="none" stroke-opacity=".35" stroke-width="4"/><path d="M100 100L100 42M100 100L150.2 71M100 100L150.2 129M100 100L100 158M100 100L49.8 129M100 100L49.8 71" stroke-width="6"/></g><g fill="#FFFFFF"><circle cx="150.2" cy="71" r="10"/><circle cx="150.2" cy="129" r="10"/><circle cx="100" cy="158" r="10"/><circle cx="49.8" cy="129" r="10"/><circle cx="49.8" cy="71" r="10"/></g><circle cx="100" cy="42" r="13" fill="#E0A21A"/><circle cx="100" cy="100" r="20" fill="#E0A21A"/></svg>';
const SG = {correo:'contacto@skynetgenesis.com', wa:'3044375758'};
const EN_MARCO = (()=>{try{return window.self!==window.top}catch(e){return true}})();
const KEY='diligencia_v1';

// ---------- utilidades ----------
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const HOY=ymd(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5); // b - a
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fLarga=s=>{if(!s)return '';const d=pd(s);return d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear()};
const fCorta=s=>{if(!s)return '—';const d=pd(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const fDia=s=>{const d=pd(s);return DIAS[d.getDay()]+' '+d.getDate()+' '+MES3[d.getMonth()].toLowerCase()};
const cop=n=>'$'+Math.round(Number(n)||0).toLocaleString('es-CO');
const num=v=>Number(String(v).replace(/[^\d.-]/g,''))||0;

// ---------- calendario judicial colombiano ----------
function pascua(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return new Date(y,mes-1,dia)}
const _fest={};
function festivos(y){ // Ley 51 de 1983 (Ley Emiliani)
  if(_fest[y])return _fest[y];
  const r={};const fijo=(m,d,n)=>r[ymd(new Date(y,m-1,d))]=n;
  const lunes=(m,d,n)=>{const x=new Date(y,m-1,d);const w=x.getDay();if(w!==1)x.setDate(x.getDate()+((8-w)%7));r[ymd(x)]=n};
  const p=pascua(y);const rel=(n,t)=>{const x=new Date(p);x.setDate(x.getDate()+n);r[ymd(x)]=t};
  fijo(1,1,'Año Nuevo');fijo(5,1,'Día del Trabajo');fijo(7,20,'Independencia');fijo(8,7,'Batalla de Boyacá');fijo(12,8,'Inmaculada Concepción');fijo(12,25,'Navidad');
  lunes(1,6,'Reyes Magos');lunes(3,19,'San José');lunes(6,29,'San Pedro y San Pablo');lunes(8,15,'Asunción de la Virgen');lunes(10,12,'Día de la Raza');lunes(11,1,'Todos los Santos');lunes(11,11,'Independencia de Cartagena');
  rel(-3,'Jueves Santo');rel(-2,'Viernes Santo');rel(43,'Ascensión del Señor');rel(64,'Corpus Christi');rel(71,'Sagrado Corazón');
  return _fest[y]=r;
}
function semanaSanta(y){const p=pascua(y);return [-6,-5,-4].map(n=>{const x=new Date(p);x.setDate(x.getDate()+n);return ymd(x)})}
function enVacancia(s){const d=pd(s);const m=d.getMonth()+1,dd=d.getDate();return (m===12&&dd>=20)||(m===1&&dd<=10)}
function motivoInhabil(s,opt){ // opt: {vacancia,semanaSanta,cierres[]}
  const d=pd(s);const w=d.getDay();
  if(w===0)return 'Domingo'; if(w===6)return 'Sábado';
  const f=festivos(d.getFullYear())[s]; if(f)return 'Festivo: '+f;
  if(opt.vacancia&&enVacancia(s))return 'Vacancia judicial (20 dic – 10 ene)';
  if(opt.semanaSanta&&semanaSanta(d.getFullYear()).includes(s))return 'Semana Santa (despachos cerrados)';
  const c=(opt.cierres||[]).find(x=>x.fecha===s); if(c)return 'Cierre: '+c.motivo;
  return '';
}
const habil=(s,opt)=>!motivoInhabil(s,opt);
function sigHabil(s,opt){let x=s;while(!habil(x,opt))x=addD(x,1);return x}
function sumarHabiles(s,n,opt){let x=s,c=0;while(c<n){x=addD(x,1);if(habil(x,opt))c++}return x}
function habilesEntre(a,b,opt){ // días hábiles desde a (excl.) hasta b (incl.); negativo si b<a
  if(a===b)return 0; let c=0; if(b>a){let x=a;while(x<b){x=addD(x,1);if(habil(x,opt))c++}return c}
  let x=b;while(x<a){x=addD(x,1);if(habil(x,opt))c++}return -c;
}
// Cómputo de términos: CGP art. 118 y Ley 2213 de 2022 art. 8
function calcularTermino({fecha,cantidad,unidad,ley2213,opt}){
  const pasos=[];let base=fecha;
  if(ley2213){base=sumarHabiles(fecha,2,opt);pasos.push('Envío del mensaje de datos: '+fLarga(fecha)+'. La notificación se entiende surtida al terminar 2 días hábiles: '+fLarga(base)+' (Ley 2213/2022, art. 8).')}
  else pasos.push('Fecha de notificación o de la providencia: '+fLarga(fecha)+'.');
  let venc;
  if(unidad==='h'){venc=sumarHabiles(base,cantidad,opt);pasos.push('El término corre desde el día hábil siguiente ('+fLarga(sumarHabiles(base,1,opt))+') y se cuentan '+cantidad+' días hábiles, sin sábados, domingos, festivos'+(opt.vacancia?', vacancia judicial':'')+(opt.semanaSanta?', Semana Santa':'')+' ni cierres registrados (CGP art. 118).')}
  else{
    const d=pd(base);
    if(unidad==='c')d.setDate(d.getDate()+cantidad); else if(unidad==='m')d.setMonth(d.getMonth()+cantidad); else d.setFullYear(d.getFullYear()+cantidad);
    venc=ymd(d);pasos.push('Término en '+({c:'días calendario',m:'meses',a:'años'})[unidad]+': se cuenta conforme al calendario hasta '+fLarga(venc)+'.');
    const m=motivoInhabil(venc,opt);
    if(m){const v2=sigHabil(venc,opt);pasos.push('Ese día es inhábil ('+m+'); el vencimiento se traslada al primer día hábil siguiente: '+fLarga(v2)+' (CGP art. 118, inc. final).');venc=v2}
  }
  return {venc,pasos};
}

const totalCobro=b=>Math.round(b.valor*(b.iva?1.19:1));
const pagadoCobro=b=>DB.pagos.filter(p=>p.cobroId===b.id).reduce((s,p)=>s+p.valor,0);
const saldoCobro=b=>Math.max(0,totalCobro(b)-pagadoCobro(b));
function estadoCobro(b){const s=saldoCobro(b);if(s<=0)return ['Pagada','p-ver'];if(b.venc<HOY)return ['Vencida','p-rojo'];if(pagadoCobro(b)>0)return ['Abono parcial','p-amb'];return ['Pendiente','p-azul']}
function semaforoTermino(t){
  if(t.estado==='Cumplido')return {c:'p-ver',d:'d-ver',txt:'Cumplido',h:null};
  const p=byId('procesos',t.procesoId);const h=habilesEntre(HOY,t.venc,optOf(p));
  if(t.venc<HOY)return {c:'p-rojo',d:'d-rojo',txt:'Vencido',h};
  if(t.venc===HOY)return {c:'p-rojo',d:'d-rojo',txt:'Vence HOY',h:0};
  if(h<=2)return {c:'p-rojo',d:'d-rojo',txt:h+' día'+(h===1?'':'s')+' háb.',h};
  if(h<=5)return {c:'p-amb',d:'d-amb',txt:h+' días háb.',h};
  return {c:'p-ver',d:'d-ver',txt:h+' días háb.',h};
}
function visibles(col){ // abogados ven lo suyo + todo lo de la oficina (ver), dependiente todo; cliente solo lo propio
  let r=de(col);
  if(S.user.rol==='cliente'){const cid=S.user.clienteId;if(col==='procesos')r=r.filter(p=>p.clienteId===cid);if(col==='cobros')r=r.filter(b=>b.clienteId===cid);if(col==='agenda'){const ps=de('procesos').filter(p=>p.clienteId===cid).map(p=>p.id);r=r.filter(a=>ps.includes(a.procesoId)&&a.tipo!=='Reunión interna')}}
  return r;
}
function alertas(){
  const L=[];const o=OF();
  de('terminos').filter(t=>t.estado!=='Cumplido').forEach(t=>{const s=semaforoTermino(t);if(t.venc<=addD(HOY,10)||s.c!=='p-ver')L.push({n:s.c==='p-rojo'?1:2,dot:s.d,t:(t.venc<HOY?'Término VENCIDO: ':'Término: ')+t.nombre,s:procTxt(byId('procesos',t.procesoId))+' · vence '+fDia(t.venc)+' · '+t.norma,ir:['terminos']})});
  de('agenda').filter(a=>a.fecha>=HOY&&a.fecha<=addD(HOY,7)).forEach(a=>L.push({n:a.fecha===HOY?1:2,dot:a.tipo==='Audiencia'?'d-azul':'d-amb',t:a.tipo+': '+a.titulo,s:fDia(a.fecha)+' '+a.hora+' · '+a.lugar,ir:['agenda']}));
  de('procesos').filter(p=>p.estado==='Activo'&&diffD(p.ultimaRevision||p.fechaInicio,HOY)>7).forEach(p=>L.push({n:3,dot:'d-amb',t:'Vigilancia: revisar estado del proceso',s:procTxt(p)+' · última revisión hace '+diffD(p.ultimaRevision||p.fechaInicio,HOY)+' días',ir:['procesos',p.id]}));
  de('tareas').filter(k=>!k.hecha&&k.fecha<=addD(HOY,1)).forEach(k=>L.push({n:k.fecha<HOY?1:3,dot:k.fecha<HOY?'d-rojo':'d-amb',t:(k.fecha<HOY?'Tarea atrasada: ':'Tarea: ')+k.titulo,s:nomUser(k.userId)+' · '+fDia(k.fecha),ir:['tareas']}));
  if(['admin','contable'].includes(S.user.rol))de('cobros').filter(b=>saldoCobro(b)>0&&b.venc<HOY).forEach(b=>L.push({n:3,dot:'d-rojo',t:'Cuenta de cobro vencida '+b.numero+' – '+cop(saldoCobro(b)),s:nomCli(b.clienteId)+' · venció '+fDia(b.venc),ir:['cobros']}));
  de('clientes').filter(c=>!c.habeas).forEach(c=>L.push({n:4,dot:'d-amb',t:'Falta autorización de tratamiento de datos (Ley 1581/2012)',s:c.nombre,ir:['clientes',c.id]}));
  return L.sort((a,b)=>a.n-b.n);
}

function catSel(){const v=$('#tc_cat').value;if(!v)return;const [g,i]=v.split('-').map(Number);const x=CATALOGO[g].t[i];$('#tc_nom').value=x[0];$('#tc_norma').value=x[3];$('#tc_cant').value=x[1];$('#tc_uni').value=x[2]}

function calcTer(){
  const p=byId('procesos',$('#tc_proc').value);if(!p){toast('Primero cree un proceso para asociar el término');return}const fecha=$('#tc_fecha').value;const cant=num($('#tc_cant').value);if(!fecha||!cant){toast('Indique fecha y cantidad');return}
  const opt=optOf(p);const r=calcularTermino({fecha,cantidad:cant,unidad:$('#tc_uni').value,ley2213:$('#tc_2213').checked,opt});
  _calc={procesoId:p.id,nombre:$('#tc_nom').value||'Término',norma:$('#tc_norma').value||'—',fecha,cantidad:cant,unidad:$('#tc_uni').value,ley2213:$('#tc_2213').checked,venc:r.venc,responsableId:$('#tc_resp').value};
  // días inhábiles en el rango, para transparencia
  const inh=[];let x=fecha;while(x<r.venc){x=addD(x,1);const m=motivoInhabil(x,opt);if(m&&!/^(Sábado|Domingo)$/.test(m))inh.push(fCorta(x)+' – '+m)}
  $('#tc_res').innerHTML='<div class="note amb" style="margin-top:12px"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px"><div><div class="small muted">VENCE</div><div style="font-family:var(--f-tit);font-size:28px;font-weight:700;line-height:1.1">'+DIAS[pd(r.venc).getDay()]+' '+fLarga(r.venc)+'</div><div class="small">Vencimiento al cierre del despacho de ese día. '+(p.sinVacancia?'Proceso que corre en vacancia.':'')+'</div></div><button class="btn pri" style="margin-left:auto" onclick="guardarTer()">Guardar y crear alerta</button></div><ol class="small" style="margin:10px 0 0;padding-left:18px">'+r.pasos.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'+(inh.length?'<p class="small" style="margin:8px 0 0"><b>Días inhábiles descontados:</b> '+esc(inh.join(' · '))+'</p>':'')+'</div>';
}
function guardarTer(){if(!_calc)return;DB.terminos.push(Object.assign({id:uid(),oficinaId:S.of,estado:'Pendiente',creado:HOY},_calc));_calc=null;guardar();render();toast('Término guardado. Aparecerá en alertas y agenda.')}

function numLetras(n){n=Math.floor(n);if(n===0)return 'cero';const U=['','un','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiún','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const c3=x=>{if(x===100)return 'cien';const c=Math.floor(x/100),r=x%100;let s=C[c];if(r){s+=(s?' ':'')+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?' y '+U[r%10]:''))}return s};
  let s='';const mill=Math.floor(n/1e6),mil=Math.floor((n%1e6)/1000),r=n%1000;
  if(mill)s+=(mill===1?'un millón':c3(mill)+' millones');if(mil)s+=(s?' ':'')+(mil===1?'mil':c3(mil)+' mil');if(r)s+=(s?' ':'')+c3(r);
  return s+((!mil&&!r&&mill)?' de':'');
}

// ---------- reportes ----------
VISTAS.reportes=()=>{
  const ps=de('procesos');const grp=(arr,f)=>arr.reduce((m,x)=>{const k=f(x);m[k]=(m[k]||0)+1;return m},{});
  const barras=(obj,fmt=v=>v)=>{const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);const mx=Math.max(...e.map(x=>x[1]),1);return '<div class="grid" style="gap:8px;margin-top:10px">'+e.map(([k,v])=>'<div style="display:grid;grid-template-columns:minmax(0,150px) 1fr 90px;gap:10px;align-items:center"><span class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(k)+'">'+esc(k)+'</span><div class="bar"><i style="width:'+(v/mx*100)+'%"></i></div><span class="num small" style="text-align:right">'+fmt(v)+'</span></div>').join('')+'</div>'};
  const porCli={};de('cobros').forEach(b=>{const s=saldoCobro(b);if(s)porCli[nomCli(b.clienteId)]=(porCli[nomCli(b.clienteId)]||0)+s});
  const ing={};DB.pagos.filter(p=>de('cobros').some(b=>b.id===p.cobroId)).forEach(p=>{const k=p.fecha.slice(0,7);ing[k]=(ing[k]||0)+p.valor});
  const term=de('terminos');const cumpl=term.filter(t=>t.estado==='Cumplido').length;
  return head('Reportes','Indicadores de la oficina para el socio administrador y contabilidad.','<button class="btn" onclick="exportarCSV()">'+(EN_MARCO?'Copiar procesos (CSV)':'Exportar procesos a Excel (CSV)')+'</button>')
  +'<div class="grid g4">'+kpi('Procesos totales',ps.length,ps.filter(p=>p.estado==='Activo').length+' activos')+kpi('Términos cumplidos',cumpl+' / '+term.length,'control de vencimientos')+kpi('Clientes',de('clientes').length,de('clientes').filter(c=>!c.habeas).length+' sin autorización de datos')+kpi('Cartera',cop(Object.values(porCli).reduce((a,b)=>a+b,0)),Object.keys(porCli).length+' clientes con saldo')+'</div>'
  +'<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Procesos activos por abogado</h3>'+barras(grp(ps.filter(p=>p.estado==='Activo'),p=>nomUser(p.abogadoId)))+'</div><div class="card"><h3>Procesos por especialidad</h3>'+barras(grp(ps,p=>p.especialidad))+'</div>'
  +'<div class="card"><h3>Saldo por cliente</h3>'+barras(porCli,cop)+'</div><div class="card"><h3>Recaudo por mes</h3>'+barras(Object.fromEntries(Object.entries(ing).sort().map(([k,v])=>[MESES[+k.slice(5)-1]+' '+k.slice(0,4),v])),cop)+'</div></div>';
};
function exportarCSV(){const rows=[['Nombre','Radicado','Clase','Despacho','Cliente','Demandante','Demandado','Etapa','Estado','Responsable','Inicio','Última revisión']].concat(de('procesos').map(p=>[p.alias,p.radicado,p.clase,p.despacho,nomCli(p.clienteId),p.demandante,p.demandado,p.etapa,p.estado,nomUser(p.abogadoId),p.fechaInicio,p.ultimaRevision]));const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  if(EN_MARCO){copiar(csv,'Procesos copiados en formato CSV');return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='procesos-diligencia.csv';a.click()}

  const N=[['Código General del Proceso – Ley 1564 de 2012','Cómputo de términos (art. 118), ejecutoria (302), recursos (318, 322), contestación (369, 391), desistimiento tácito (317).','Calculadora de términos con días hábiles y traslado al día hábil siguiente.'],

  ['Ley 270 de 1996 – Estatutaria de la Administración de Justicia','Vacancia judicial colectiva del 20 de diciembre al 10 de enero (art. 146) y Semana Santa.','Descuento automático y configurable; los procesos de tutela o garantías pueden marcarse para no descontarla.'],
  ['Ley 51 de 1983 – Festivos (Ley Emiliani)','Traslado de festivos al lunes siguiente.','Calendario de festivos calculado para cualquier año, incluidos los que dependen de la Pascua.'],
  ['CPACA – Ley 1437 de 2011, reformada por Ley 2080 de 2021','Recursos (art. 76), traslado de la demanda (172), caducidad (164), apelación (247), notificaciones electrónicas (199).','Catálogo de términos administrativos y consulta por SAMAI.'],
  ['Código Procesal del Trabajo y de la Seguridad Social','Contestación (art. 74), apelación (65), audiencias (77 y 80), prescripción (151).','Catálogo laboral y agenda de audiencias.'],
  ['Decreto 2591 de 1991 – Acción de tutela','Fallo en 10 días (art. 29) e impugnación en 3 días (art. 31).','Términos de tutela que corren también en vacancia.'],
  ['Ley 1755 de 2015 – Derecho de petición','15 días hábiles (general), 10 (documentos), 30 (consultas).','Seguimiento de asuntos extrajudiciales.'],
  ['Ley 1123 de 2007 – Código Disciplinario del Abogado','Deberes de diligencia, secreto profesional, informar al cliente y rendir cuentas de dineros y honorarios.','Alertas de vencimiento, informe al cliente, control de honorarios y gastos.'],
  ['Ley 1581 de 2012 y Decreto 1377 de 2013 – Protección de datos','Autorización previa, expresa e informada; derechos del titular.','Registro de la autorización por cliente, plantilla y alerta si falta.'],
  ['Normas tributarias (DIAN)','Factura electrónica para responsables de IVA (Res. 165 de 2023); retención en la fuente por honorarios.','Cuentas de cobro con o sin IVA y control de cartera.'],
  ['Acuerdo PCSJA23-12094 de 2023 – SIUGJ','Implementación gradual del Sistema Integrado de Gestión Judicial; conviven la Consulta Nacional Unificada, SAMAI y SIUGJ.','Cada proceso guarda su sistema de consulta y abre el portal oficial.']];
  return head('Normativa aplicada','Normas vigentes en Colombia que la app tiene en cuenta. Verifique siempre en el despacho cualquier suspensión de términos.')
  +'<div class="tw"><table><thead><tr><th>Norma</th><th>Qué regula</th><th>Cómo la aplica DiligencIA</th></tr></thead><tbody>'+N.map(n=>'<tr><td><b>'+esc(n[0])+'</b></td><td class="small">'+esc(n[1])+'</td><td class="small">'+esc(n[2])+'</td></tr>').join('')+'</tbody></table></div>'
  +'<div class="note amb" style="margin-top:14px">La calculadora es una herramienta de apoyo. El abogado responsable debe verificar los términos frente a la providencia, los acuerdos del Consejo Superior de la Judicatura y el horario del despacho.</div>';
};

// ---------- portal del cliente ----------
VISTAS.portal=()=>{
  const c=byId('clientes',S.user.clienteId);const ps=visibles('procesos');const ag=visibles('agenda').filter(a=>a.fecha>=HOY);const bs=visibles('cobros');const o=OF();
  return head('Bienvenido(a), '+esc(c.nombre),'Consulte el estado de sus asuntos con '+esc(o.nombre)+'.','<a class="btn wa" target="_blank" rel="noopener" href="'+waLink(o.tel,'Hola, soy '+c.nombre+'. Quisiera consultar sobre mis procesos.')+'">Escribir a mi abogado</a><button class="btn" onclick="docInforme(\''+c.id+'\')">Descargar informe</button>')
  +'<div class="grid g4">'+kpi('Procesos',ps.filter(p=>p.estado==='Activo').length,'en curso')+kpi('Próximas audiencias',ag.length,ag[0]?fDia(ag[0].fecha):'')+kpi('Saldo pendiente',cop(bs.reduce((s,b)=>s+saldoCobro(b),0)),'')+'</div>'
  +ps.map(p=>'<div class="card" style="margin-top:14px"><h3>'+esc(p.clase)+'</h3><p class="small muted">'+esc(p.despacho)+' · Radicado '+radHTML(p.radicado)+'</p><p class="small">Etapa actual: <b>'+esc(p.etapa)+'</b> · Abogado: '+esc(nomUser(p.abogadoId))+'</p><div class="list">'+p.actuaciones.filter(a=>a.pub).sort((a,b)=>a.f<b.f?1:-1).map(a=>'<div class="li">'+fechaBox(a.f)+'<div class="grow small">'+esc(a.t)+'</div></div>').join('')+'</div></div>').join('')
  +(ag.length?'<h3 style="margin:18px 0 10px">Próximas audiencias y citas</h3><div class="card"><div class="list">'+ag.map(a=>'<div class="li">'+fechaBox(a.fecha)+'<div class="grow"><b>'+esc(a.titulo)+'</b><div class="small muted">'+fDia(a.fecha)+' '+esc(a.hora)+' · '+esc(a.lugar)+'</div></div></div>').join('')+'</div></div>':'')
  +'<h3 style="margin:18px 0 10px">Mis cuentas</h3>'+tablaCobros(bs);
};

const PH=t=>'<mark class="ph">['+esc(t)+']</mark>';
function ctxProc(pid){const p=byId('procesos',pid);const c=p?byId('clientes',p.clienteId):null;const ab=p?(byId('users',p.abogadoId)||{}):{};return {p,c,ab,o:OF()}}
function ctxCli(cid){const c=byId('clientes',cid);const o=OF();const ab=de('users').find(u=>u.id===S.user.id&&['admin','abogado'].includes(u.rol))||de('users').find(u=>u.rol==='admin')||{};return {c,ab,o,p:null}}

const firmaAb=(ab)=>'<div class="firma"><div>'+esc(ab.nombre||'')+'<br>C.C. '+PH('cédula')+'<br>T.P. '+esc(ab.tp||'')+' del C. S. de la J.<br>'+esc(ab.email||'')+'</div></div>';
const firmaCli=(c)=>'<div class="firma"><div>'+esc(c.nombre)+'<br>'+esc(c.doc)+'<br>'+esc(c.canal||c.email)+'</div></div>';
const yoAb=(ab,c,p)=>'<b>'+esc(ab.nombre||'')+'</b>, abogado(a) en ejercicio, identificado(a) con la tarjeta profesional '+esc(ab.tp||'')+' del Consejo Superior de la Judicatura, actuando como apoderado(a) de <b>'+esc(c.nombre)+'</b>'+(p?' ('+esc(p.rolCliente.toLowerCase())+')':'')+',';

const DOCS=[
 // ---------- Poderes y mandato ----------
 {id:'poder',cat:'Poderes y mandato',n:'Poder especial',d:'Por mensaje de datos (Ley 2213, art. 5) con correo inscrito en el SIRNA.',b:'proc',f:pid=>docPoder(pid)},
 {id:'sustitucion',cat:'Poderes y mandato',n:'Sustitución de poder',d:'CGP art. 75. El apoderado sustituye en otro abogado.',b:'proc',f:pid=>{const {p,c,ab}=ctxProc(pid);return ['Sustitución de poder',aDespacho(p)+refProc(p)+'<p>'+yoAb(ab,c,p)+' según poder que obra en el expediente, manifiesto que <b>SUSTITUYO</b> el poder a mí conferido en el(la) abogado(a) '+PH('nombre del sustituto')+', identificado(a) con C.C. '+PH('cédula')+' y T.P. '+PH('tarjeta profesional')+', con correo inscrito en el SIRNA '+PH('correo')+', con las mismas facultades a mí otorgadas, de conformidad con el artículo 75 del Código General del Proceso.</p><p>Me reservo la facultad de reasumir el poder en cualquier momento.</p>'+firmaAb(ab)+'<div class="firma"><div>Acepto,<br>'+PH('nombre del sustituto')+'<br>T.P. '+PH('tarjeta')+'</div></div>']}},
 {id:'renuncia',cat:'Poderes y mandato',n:'Renuncia al poder',d:'CGP art. 76. Incluye la constancia de comunicación al poderdante.',b:'proc',f:pid=>{const {p,c,ab}=ctxProc(pid);return ['Renuncia al poder',aDespacho(p)+refProc(p)+'<p>'+yoAb(ab,c,p)+' de manera respetuosa presento <b>RENUNCIA</b> al poder a mí conferido dentro del proceso de la referencia, de conformidad con el artículo 76 del Código General del Proceso.</p><p>Para los efectos de la norma citada, adjunto la comunicación enviada a mi poderdante al correo electrónico '+esc(c.canal||c.email)+' el día '+PH('fecha de envío')+'. La renuncia produce efectos cinco (5) días después de presentado este memorial en el juzgado, acompañado de dicha comunicación.</p><p>Manifiesto que me encuentro '+PH('a paz y salvo / con honorarios pendientes')+' por concepto de honorarios.</p>'+firmaAb(ab)]}},
 {id:'revocatoria',cat:'Poderes y mandato',n:'Revocatoria de poder',d:'El cliente revoca el poder y designa nuevo apoderado (CGP art. 76).',b:'proc',f:pid=>{const {p,c,ab}=ctxProc(pid);return ['Revocatoria de poder',aDespacho(p)+refProc(p)+'<p><b>'+esc(c.nombre)+'</b>, identificado(a) con '+esc(c.doc)+', obrando en calidad de '+esc(p.rolCliente.toLowerCase())+', manifiesto que <b>REVOCO</b> el poder conferido al(la) abogado(a) '+PH('nombre del apoderado anterior')+' y, en su lugar, confiero poder especial a <b>'+esc(ab.nombre||'')+'</b>, T.P. '+esc(ab.tp||'')+', correo SIRNA '+esc(ab.email||'')+', con las facultades del artículo 77 del Código General del Proceso.</p><p>Este documento se otorga por mensaje de datos conforme al artículo 5.º de la Ley 2213 de 2022.</p>'+firmaCli(c)+'<div class="firma"><div>Acepto,<br>'+esc(ab.nombre||'')+'<br>T.P. '+esc(ab.tp||'')+'</div></div>']}},
 // ---------- Relación con el cliente ----------
 {id:'propuesta',cat:'Relación con el cliente',n:'Propuesta de honorarios',d:'Cotización formal del servicio antes de firmar contrato.',b:'cli',f:cid=>{const {c,o}=ctxCli(cid);return ['Propuesta de servicios profesionales','<p>Señor(a)<br><b>'+esc(c.nombre)+'</b><br>'+esc(c.dir)+'</p><p>Respetado(a) cliente: de acuerdo con la consulta realizada el '+PH('fecha de la consulta')+', presentamos nuestra propuesta:</p><p><b>1. Asunto.</b> '+PH('descripción del caso')+'</p><p><b>2. Alcance del servicio.</b> '+PH('actuaciones incluidas: estudio, demanda, audiencias, recursos, etc.')+'</p><p><b>3. Honorarios.</b> '+PH('valor y modalidad: suma fija / por etapas / cuota litis')+'. Forma de pago: '+PH('anticipo y cuotas')+'.</p><p><b>4. Gastos del proceso.</b> No incluidos: aranceles, notificaciones, pólizas, peritos y auxiliares de la justicia, que asume el cliente.</p><p><b>5. Vigencia de la propuesta.</b> 30 días calendario.</p><p>Quedamos atentos a sus comentarios.</p><div class="firma"><div>'+esc(o.nombre)+'</div></div>']}},
 {id:'contrato',cat:'Relación con el cliente',n:'Contrato de prestación de servicios',d:'Objeto, honorarios, gastos, deberes (Ley 1123/2007) y datos personales.',b:'proc',f:pid=>docContrato(pid)},
 {id:'autorizacion',cat:'Relación con el cliente',n:'Autorización de tratamiento de datos',d:'Previa, expresa e informada (Ley 1581/2012).',b:'cli',f:cid=>docAutorizacion(cid)},
 {id:'informe',cat:'Relación con el cliente',n:'Informe al cliente (rendición de cuentas)',d:'Estado de cada proceso, actuaciones, próximas diligencias y cuenta.',b:'cli',f:cid=>docInforme(cid)},
 {id:'asesoria',cat:'Relación con el cliente',n:'Constancia de asesoría jurídica',d:'Deja por escrito lo consultado y lo recomendado.',b:'cli',f:cid=>{const {c,ab}=ctxCli(cid);return ['Constancia de asesoría jurídica','<p>Fecha: '+fLarga(HOY)+'<br>Consultante: <b>'+esc(c.nombre)+'</b> ('+esc(c.doc)+')<br>Abogado(a): '+esc(ab.nombre||'')+'</p><p><b>Asunto consultado:</b> '+PH('resumen de la consulta')+'</p><p><b>Documentos revisados:</b> '+PH('lista de documentos')+'</p><p><b>Concepto y recomendaciones:</b> '+PH('concepto jurídico')+'</p><p><b>Términos a tener en cuenta:</b> '+PH('caducidad / prescripción / plazos')+'</p><p>El presente concepto se emite con base en la información suministrada por el consultante y no constituye garantía de resultado. La información se trata bajo secreto profesional (Ley 1123 de 2007).</p><div class="firma"><div>'+esc(ab.nombre||'')+'<br>T.P. '+esc(ab.tp||'')+'</div><div>Recibido,<br>'+esc(c.nombre)+'</div></div>']}},
 {id:'entrega',cat:'Relación con el cliente',n:'Acta de entrega y recibo de documentos',d:'Registro de documentos originales recibidos o devueltos al cliente.',b:'cli',f:cid=>{const {c,o}=ctxCli(cid);return ['Acta de entrega y recibo de documentos','<p>En '+esc(o.ciudad)+', el '+fLarga(HOY)+', se deja constancia de que <b>'+esc(c.nombre)+'</b> ('+esc(c.doc)+') '+PH('entrega a / recibe de')+' <b>'+esc(o.nombre)+'</b> los siguientes documentos:</p><table><thead><tr><th>#</th><th>Documento</th><th>Original / copia</th><th>Folios</th></tr></thead><tbody>'+[1,2,3,4,5].map(i=>'<tr><td>'+i+'</td><td>'+PH('documento')+'</td><td>'+PH('O/C')+'</td><td>'+PH('n.º')+'</td></tr>').join('')+'</tbody></table><div class="firma"><div>Entrega</div><div>Recibe</div></div>']}},
 {id:'pazysalvo',cat:'Relación con el cliente',n:'Paz y salvo de honorarios',d:'Certifica que el cliente no tiene saldos pendientes.',b:'cli',f:cid=>{const {c,o}=ctxCli(cid);const sal=de('cobros').filter(b=>b.clienteId===cid).reduce((s,b)=>s+saldoCobro(b),0);return ['Paz y salvo',(sal?'<p class="small" style="color:#C0392B"><b>Atención:</b> el cliente registra un saldo de '+cop(sal)+' en la app. Verifique antes de expedir.</p>':'')+'<p><b>'+esc(o.nombre)+'</b>, identificado(a) con NIT/CC '+esc(o.nit)+', certifica que <b>'+esc(c.nombre)+'</b>, identificado(a) con '+esc(c.doc)+', se encuentra a <b>PAZ Y SALVO</b> por concepto de honorarios profesionales y gastos relacionados con '+PH('asunto o proceso')+', a la fecha '+fLarga(HOY)+'.</p><p>Se expide a solicitud del interesado.</p><div class="firma"><div>'+esc(o.nombre)+'</div></div>']}},
 {id:'recibo',cat:'Relación con el cliente',n:'Recibo de pago',d:'Comprobante de abonos de una cuenta de cobro.',b:'cobro',f:bid=>{const b=byId('cobros',bid);const c=byId('clientes',b.clienteId);const o=OF();const ps=DB.pagos.filter(x=>x.cobroId===bid);const pag=ps.reduce((s,x)=>s+x.valor,0);return ['Recibo de pago – '+b.numero,'<p>'+esc(o.nombre)+' recibió de <b>'+esc(c.nombre)+'</b> ('+esc(c.doc)+') la suma de <b>'+numLetras(pag)+' pesos m/cte ('+cop(pag)+')</b> como abono a la cuenta de cobro '+esc(b.numero)+' por concepto de: '+esc(b.concepto)+'.</p><table><thead><tr><th>Fecha</th><th>Medio</th><th style="text-align:right">Valor</th></tr></thead><tbody>'+(ps.map(x=>'<tr><td>'+fCorta(x.fecha)+'</td><td>'+esc(x.medio)+'</td><td style="text-align:right">'+cop(x.valor)+'</td></tr>').join('')||'<tr><td colspan="3">Sin pagos registrados</td></tr>')+'<tr><td colspan="2"><b>Saldo pendiente</b></td><td style="text-align:right"><b>'+cop(saldoCobro(b))+'</b></td></tr></tbody></table><div class="firma"><div>Recibido por<br>'+esc(o.nombre)+'</div></div>']}},
 // ---------- Memoriales y escritos judiciales ----------
 {id:'demanda',cat:'Memoriales y escritos judiciales',n:'Demanda (estructura CGP art. 82)',d:'Esqueleto con todos los requisitos formales y los de la Ley 2213.',b:'proc',f:pid=>{const {p,c,ab}=ctxProc(pid);return ['Demanda – '+p.clase,aDespacho(p)+'<p>Referencia: <b>'+esc(p.clase)+'</b><br>Demandante: '+esc(p.demandante)+'<br>Demandado: '+esc(p.demandado)+'</p><p>'+yoAb(ab,c,p)+' según poder adjunto, presento <b>DEMANDA</b> en contra de '+esc(p.demandado)+', identificado(a) con '+PH('documento')+', domiciliado(a) en '+PH('ciudad')+', con fundamento en lo siguiente:</p><h4>I. PARTES</h4><p>Demandante: '+esc(c.nombre)+', '+esc(c.doc)+', domicilio '+esc(c.dir)+'.<br>Demandado: '+esc(p.demandado)+', '+PH('documento y domicilio')+'. Representante legal (si aplica): '+PH('nombre')+'.</p><h4>II. PRETENSIONES</h4><p>1. '+PH('pretensión principal')+'<br>2. '+PH('pretensión consecuencial')+'<br>3. Condenar en costas y agencias en derecho a la parte demandada.</p><h4>III. HECHOS</h4><p>1. '+PH('hecho')+'<br>2. '+PH('hecho')+'<br>3. '+PH('hecho')+'</p><h4>IV. FUNDAMENTOS DE DERECHO</h4><p>'+PH('normas sustanciales y procesales aplicables')+'</p><h4>V. JURAMENTO ESTIMATORIO (CGP art. 206)</h4><p>'+PH('estimación razonada bajo juramento, si se piden perjuicios o frutos')+'</p><h4>VI. PRUEBAS</h4><p>Documentales: '+PH('lista')+'<br>Testimoniales: '+PH('nombre, dirección y objeto del testimonio')+'<br>Otras: '+PH('dictámenes, inspección, etc.')+'</p><h4>VII. CUANTÍA Y COMPETENCIA</h4><p>Estimo la cuantía en '+(p.cuantia?cop(p.cuantia):PH('valor'))+'. Es usted competente por '+PH('naturaleza, cuantía y domicilio / lugar de cumplimiento')+'.</p><h4>VIII. PROCEDIMIENTO</h4><p>'+PH('verbal / verbal sumario / ejecutivo / etc.')+'</p><h4>IX. ANEXOS</h4><p>Poder; documentos relacionados en pruebas; certificado de existencia y representación (si aplica); constancia de conciliación extrajudicial como requisito de procedibilidad (cuando aplique, Ley 2220 de 2022); constancia del envío simultáneo de la demanda al demandado (Ley 2213, art. 6), salvo que se pidan medidas cautelares.</p><h4>X. NOTIFICACIONES</h4><p>Demandante: '+esc(c.canal||c.email)+'. Demandado: '+PH('correo electrónico')+'; manifiesto bajo juramento que esta dirección corresponde a la utilizada por la persona a notificar, la obtuve de '+PH('fuente')+' y aporto evidencia (Ley 2213, art. 8). Apoderado: '+esc(ab.email||'')+' (inscrito en el SIRNA).</p>'+firmaAb(ab)]}},
 {id:'contestacion',cat:'Memoriales y escritos judiciales',n:'Contestación de demanda (CGP art. 96)',d:'Pronunciamiento sobre hechos y pretensiones, excepciones y pruebas.',b:'proc',f:pid=>{const {p,c,ab}=ctxProc(pid);return ['Contestación de la demanda',aDespacho(p)+refProc(p)+'<p>'+yoAb(ab,c,p)+' dentro del término legal, doy <b>CONTESTACIÓN</b> a la demanda en los siguientes términos:</p><h4>I. A LAS PRETENSIONES</h4><p>Me opongo a todas y cada una de las pretensiones por carecer de fundamento fáctico y jurídico, por las razones que se exponen.</p><h4>II. A LOS HECHOS</h4><p>Al 1.º: '+PH('es cierto / no es cierto / no me consta, y por qué')+'<br>Al 2.º: '+PH('pronunciamiento')+'</p><h4>III. EXCEPCIONES DE MÉRITO</h4><p>1. '+PH('nombre de la excepción')+': '+PH('fundamento')+'<br>2. Genérica: solicito declarar las excepciones que resulten probadas (CGP art. 282).</p><h4>IV. OBJECIÓN AL JURAMENTO ESTIMATORIO</h4><p>'+PH('si aplica, especificar razonadamente la inexactitud (CGP art. 206)')+'</p><h4>V. PRUEBAS</h4><p>'+PH('documentales, testimoniales, interrogatorio de parte')+'</p><h4>VI. NOTIFICACIONES</h4><p>Demandado: '+esc(c.canal||c.email)+'. Apoderado: '+esc(ab.email||'')+'.</p><p>Copia de este escrito se envía simultáneamente a las demás partes (CGP art. 78-14 y Ley 2213, art. 3).</p>'+firmaAb(ab)]}},

function abrirPlantillaPropia(id,ref){

  if(pl.base==='proc'){({p,c,ab}=ctxProc(ref))}else{({c,ab}=ctxCli(ref))}
  const v={cliente:c.nombre,cliente_documento:c.doc,cliente_direccion:c.dir,cliente_correo:c.canal||c.email,cliente_telefono:c.tel,radicado:p?p.radicado:'',despacho:p?p.despacho:'',clase:p?p.clase:'',demandante:p?p.demandante:'',demandado:p?p.demandado:'',etapa:p?p.etapa:'',abogado:ab.nombre||'',tarjeta:ab.tp||'',abogado_correo:ab.email||'',oficina:OF().nombre,oficina_nit:OF().nit,ciudad:OF().ciudad,fecha:fLarga(HOY)};

async function api(ruta,cuerpo,metodo){
  const r=await fetch(API+ruta,{method:metodo||(cuerpo?'POST':'GET'),headers:Object.assign({'content-type':'application/json'},TOKEN?{Authorization:'Bearer '+TOKEN}:{}),body:cuerpo?JSON.stringify(cuerpo):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&TOKEN){tokSet(null);TOKEN=null;S.user=null;render();throw new Error(j.error||'Sesión terminada')}
  if(!r.ok){const e=new Error(j.error||('Error '+r.status));e.datos=j;e.status=r.status;throw e}return j;
}

function syncReal(){
  if(S.user&&S.user.rol==='cliente')return;
  const cambios=[],borrar=[],vistos=new Set();
  COLS.forEach(c=>(DB[c]||[]).forEach(x=>{if(!x.oficinaId)x.oficinaId=S.of;const k=c+'|'+x.id;vistos.add(k);const j=JSON.stringify(x);if(SNAP[k]!==j){cambios.push({col:c,id:x.id,datos:JSON.parse(j)});SNAP[k]=j}}));
  Object.keys(SNAP).forEach(k=>{if(!vistos.has(k)){const i=k.indexOf('|');borrar.push({col:k.slice(0,i),id:k.slice(i+1)});delete SNAP[k]}});
  const ofj=ofJSON();const ofCambio=ofj!==SNAP_OF&&S.user.rol==='admin';if(ofCambio)SNAP_OF=ofj;

  formModal('Nueva oficina cliente',[{k:'nombre',l:'Nombre de la firma o del abogado',req:1,full:1},{k:'nit',l:'NIT o cédula'},{k:'ciudad',l:'Ciudad'},{k:'tel',l:'Teléfono / WhatsApp'},{k:'email',l:'Correo de la oficina',type:'email'},{k:'plan',l:'Plan',type:'select',opts:PLANES.map(p=>[p.id,p.n+' – '+cop(p.p)])},{k:'pagadoHasta',l:'Pagado hasta',type:'date',def:(()=>{const d=pd(HOY);return ymd(new Date(d.getFullYear(),d.getMonth()+1,0))})()},{k:'an',l:'Nombre del socio administrador',req:1},{k:'ae',l:'Correo del administrador (inicio de sesión)',type:'email',req:1},{k:'ap',l:'Contraseña temporal',req:1,def:claveTemp()}],null,d=>{
    api('/api/super/oficinas',{nombre:d.nombre,nit:d.nit,ciudad:d.ciudad,tel:d.tel,email:d.email,plan:d.plan,pagadoHasta:d.pagadoHasta,admin:{nombre:d.an,email:d.ae,password:d.ap}}).then(()=>{SUPER=null;render();credenciales(d.an,d.ae,d.ap,d.tel)}).catch(e=>toast(e.message));

function editarOficinaSuper(id){const o=SUPER.find(x=>x.id===id);formModal(o.nombre,[{k:'plan',l:'Plan',type:'select',opts:PLANES.map(p=>[p.id,p.n+' – '+cop(p.p)])},{k:'estado',l:'Estado',type:'select',opts:[['activa','Activa'],['solo_consulta','Solo consulta (mensualidad pendiente)']]},{k:'pagadoHasta',l:'Pagado hasta',type:'date'}],{plan:o.plan,estado:o.estado,pagadoHasta:o.pagadoHasta?String(o.pagadoHasta).slice(0,10):''},d=>{api('/api/super/oficinas/'+id,d,'PUT').then(()=>{SUPER=null;render();toast('Oficina actualizada')}).catch(e=>toast(e.message))})}
